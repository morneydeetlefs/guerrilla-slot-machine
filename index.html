<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerrilla Gardener's Fortune Slot Machine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #228B22; /* Forest green for gardening theme */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .slot-machine {
            background-color: #006400; /* Dark green */
            border: 5px solid #8B4513; /* Earthy brown border */
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            max-width: 700px;
        }
        #payline-label {
            font-size: 20px;
            color: #FFD700;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .reels-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        .reels {
            display: flex;
            justify-content: center;
            height: 100%;
            gap: 8px;
        }
        .reel {
            width: 90px;
            height: 300px;
            background-color: #fff;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 2s ease-out;
        }
        .symbol {
            height: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            box-sizing: border-box;
        }
        .reel-highlight {
            position: absolute;
            inset: 100px 0 100px 0;
            background: rgba(255, 255, 0, 0.2);
            border: 3px solid transparent;
            border-top: 3px solid #FFD700;
            border-bottom: 3px solid #FFD700;
            opacity: 0;
            transition: opacity 0.3s, box-shadow 0.3s;
            pointer-events: none;
            z-index: 2;
        }
        .reel-highlight.active {
            opacity: 1;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.8);
            animation: highlight-glow 1s ease-in-out infinite alternate;
        }
        @keyframes highlight-glow {
            from { box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.5); }
            to { box-shadow: inset 0 0 30px rgba(255, 215, 0, 1); }
        }
        .payline {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, transparent 0%, #FFD700 15%, #FFD700 85%, transparent 100%);
            transform: translateY(-50%);
            opacity: 0.3;
            transition: all 0.5s ease;
            border-radius: 2px;
            z-index: 3;
        }
        .payline.big-win {
            opacity: 1;
            box-shadow: 0 0 20px #FFD700;
            animation: payline-pulse 1.5s infinite;
        }
        @keyframes payline-pulse {
            0%, 100% { transform: translateY(-50%) scaleX(1); }
            50% { transform: translateY(-50%) scaleX(1.1); }
        }
        @keyframes win-shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-3px); }
            20%, 40%, 60%, 80% { transform: translateX(3px); }
        }
        #spin-button {
            background-color: #FFD700;
            color: #006400;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #spin-button:hover {
            background-color: #FFEC8B;
        }
        #spin-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #balance {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #message {
            font-size: 18px;
            color: #FFD700;
            transition: all 0.3s;
            min-height: 25px;
        }
        #message.win {
            font-size: 24px;
            color: #FFEB3B;
            text-shadow: 0 0 10px #FFD700;
            animation: bounce 0.6s ease-in-out;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <h1>Guerrilla Gardener's Fortune</h1>
        <div id="balance">Seed Credits: 500</div>
        <div id="payline-label">Center Line Wins Only! 🎯</div>
        <div class="reels-container">
            <div class="reels">
                <div class="reel">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
            </div>
            <div class="payline"></div>
        </div>
        <button id="spin-button">Spin to Plant!</button>
        <div id="message"></div>
    </div>

    <script>
        const symbols = ['🌱', '🌿', '🌳', '🛠️', '💧'];
        const reels = document.querySelectorAll('.reel');
        const reelStrips = Array.from(reels).map(reel => reel.querySelector('.reel-strip'));
        const reelHighlights = Array.from(reels).map(reel => reel.querySelector('.reel-highlight'));
        const payline = document.querySelector('.payline');
        const spinButton = document.getElementById('spin-button');
        const balanceDisplay = document.getElementById('balance');
        const messageDisplay = document.getElementById('message');
        let balance = 500;
        const spinCost = 20;
        const symbolHeight = 100;
        const visibleSymbols = 3;
        const extraSymbols = 25; // More for longer spins
        const winAmounts = {
            '🌱': 20,
            '🌿': 30,
            '🌳': 50,
            '🛠️': 40,
            '💧': 25
        };

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioCtx.createOscillator();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);
            oscillator.stop(audioCtx.currentTime + duration / 1000);
        }

        function playSpinSound() {
            playSound(700, 250, 'sawtooth');
            setTimeout(() => playSound(550, 250, 'sawtooth'), 150);
            setTimeout(() => playSound(450, 250, 'sawtooth'), 350);
            setTimeout(() => playSound(350, 300, 'sawtooth'), 550);
        }

        function playStopSound() {
            playSound(120, 120, 'square');
        }

        function playSmallWinSound() {
            playSound(523, 300);
            setTimeout(() => playSound(659, 300), 200);
        }

        function playBigWinSound() {
            playSound(440, 250);
            setTimeout(() => playSound(554, 250), 200);
            setTimeout(() => playSound(659, 250), 450);
            setTimeout(() => playSound(784, 400), 700);
        }

        function playMegaSound() {
            playBigWinSound();
            setTimeout(() => {
                playSound(880, 300);
                setTimeout(() => playSound(1046, 600), 250);
            }, 1400);
        }

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function createStrip(reelStrip) {
            reelStrip.innerHTML = '';
            for (let i = 0; i < visibleSymbols + extraSymbols; i++) {
                const symbol = document.createElement('div');
                symbol.classList.add('symbol');
                symbol.textContent = getRandomSymbol();
                reelStrip.appendChild(symbol);
            }
        }

        function prepareStrip(reelStrip, finalSymbol) {
            reelStrip.innerHTML = '';
            for (let i = 0; i < visibleSymbols + extraSymbols; i++) {
                const symbol = document.createElement('div');
                symbol.classList.add('symbol');
                symbol.textContent = getRandomSymbol();
                reelStrip.appendChild(symbol);
            }
            const spinAmount = extraSymbols - Math.floor(Math.random() * visibleSymbols);
            const middlePosition = spinAmount + 1;
            reelStrip.children[middlePosition].textContent = finalSymbol;
            return spinAmount * symbolHeight;
        }

        function clearHighlights() {
            reelHighlights.forEach(h => h.classList.remove('active'));
            payline.classList.remove('big-win');
        }

        function highlightReels(indices) {
            const indexSet = new Set(indices);
            reelHighlights.forEach((highlight, i) => {
                highlight.classList.toggle('active', indexSet.has(i));
            });
        }

        function spin() {
            if (balance < spinCost) {
                messageDisplay.textContent = 'Out of seeds! Refresh to replant.';
                messageDisplay.classList.remove('win');
                spinButton.disabled = true;
                return;
            }
            clearHighlights();
            balance -= spinCost;
            updateBalance();
            messageDisplay.textContent = '';
            messageDisplay.classList.remove('win');
            spinButton.disabled = true;

            const numReels = reelStrips.length;
            const finalSymbols = Array(numReels).fill().map(() => getRandomSymbol());

            playSpinSound();

            const durations = [1.0, 1.4, 1.8, 2.2, 2.6];
            const maxDuration = Math.max(...durations) * 1000 + 800;

            reelStrips.forEach((reelStrip, index) => {
                const spinDistance = prepareStrip(reelStrip, finalSymbols[index]);
                reelStrip.style.transition = 'none';
                reelStrip.style.transform = 'translateY(0px)';
                reelStrip.offsetHeight;
                reelStrip.style.transition = `transform ${durations[index]}s ease-out`;
                reelStrip.style.transform = `translateY(-${spinDistance}px)`;

                setTimeout(() => playStopSound(), durations[index] * 1000 - 80);
            });

            setTimeout(() => {
                checkWin(finalSymbols);
                spinButton.disabled = false;
            }, maxDuration);
        }

        function checkWin(finalSymbols) {
            let totalWin = 0;
            let winMessages = [];
            let highlightGroups = [];
            let maxLen = 0;

            // Find maximal streaks
            let i = 0;
            while (i < finalSymbols.length) {
                let j = i + 1;
                while (j < finalSymbols.length && finalSymbols[j] === finalSymbols[i]) j++;
                const len = j - i;
                if (len >= 2) {
                    const sym = finalSymbols[i];
                    let payout;
                    switch (len) {
                        case 5: payout = winAmounts[sym] * 10; break;
                        case 4: payout = winAmounts[sym] * 5; break;
                        case 3: payout = winAmounts[sym] * 2; break;
                        case 2: payout = 10; break;
                        default: payout = 0;
                    }
                    totalWin += payout;
                    highlightGroups.push(Array.from({length: len}, (_, k) => i + k));
                    winMessages.push(`${len}x ${sym}`);
                    maxLen = Math.max(maxLen, len);
                }
                i = j;
            }

            let message = '';
            if (totalWin > 0) {
                balance += totalWin;
                updateBalance();
                message = winMessages.join(' + ') + ` = +${totalWin} seeds! 🎉`;
                messageDisplay.classList.add('win');

                // Highlights
                const highlightIndices = [];
                highlightGroups.forEach(group => group.forEach(idx => highlightIndices.push(idx)));
                highlightReels(highlightIndices);

                // Payline glow on big streaks
                if (maxLen >= 3) {
                    payline.classList.add('big-win');
                }

                // Shake winning reels
                const shakeDuration = maxLen >= 4 ? 1000 : 600;
                const shakeReels = highlightIndices.map(idx => reels[idx]);
                shakeReels.forEach(reel => {
                    reel.style.animation = `win-shake ${shakeDuration / 1000}s ease-in-out`;
                });
                setTimeout(() => {
                    shakeReels.forEach(reel => reel.style.animation = '');
                }, shakeDuration);

                // Sounds
                if (maxLen === 5) {
                    playMegaSound();
                } else if (maxLen >= 3) {
                    playBigWinSound();
                } else {
                    playSmallWinSound();
                }
            } else {
                message = 'No growth this time. Try again!';
            }
            messageDisplay.textContent = message;

            // Clear highlights after celebration
            setTimeout(clearHighlights, 5000);
        }

        function updateBalance() {
            balanceDisplay.textContent = `Seed Credits: ${balance}`;
        }

        // Initialize
        reelStrips.forEach(createStrip);
        spinButton.addEventListener('click', spin);
    </script>
</body>
</html>
