<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerrilla Gardener's Fortune</title>
    <style>
        :root {
            --reel-size: 80px;
            --symbol-size: 80px;
        }

        @media (min-width: 500px) {
            :root {
                --reel-size: 90px;
                --symbol-size: 100px;
            }
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#1b5e20, #0d3311);
            color: #fff;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .slot-machine {
            background: #006400;
            border: 4px solid #8B4513;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.6rem;
            margin: 8px 0 12px;
            color: #FFEB3B;
            text-shadow: 0 2px 4px #000;
        }

        #balance {
            font-size: 1.4rem;
            margin: 8px 0;
            font-weight: bold;
        }

        #bet-info {
            font-size: 1rem;
            color: #FFD700;
            margin: 6px 0 12px;
        }

        #payline-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .line-btn {
            background: #004d00;
            color: white;
            border: 2px solid #FFD700;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            min-width: 70px;
            touch-action: manipulation;
        }

        .line-btn.active {
            background: #FFD700;
            color: #004d00;
            box-shadow: 0 0 10px #FFD700;
        }

        .reels-container {
            position: relative;
            height: calc(var(--reel-size) * 3);
            margin: 12px 0;
            width: 100%;
            max-width: 420px;
        }

        .reels {
            display: flex;
            justify-content: center;
            gap: 6px;
            height: 100%;
        }

        .reel {
            width: var(--reel-size);
            height: 100%;
            background: white;
            border: 2px solid #222;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 2s ease-out;
        }

        .symbol {
            height: var(--symbol-size);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--reel-size) * 0.65);
        }

        .payline {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, transparent, #FFD700 20%, #FFD700 80%, transparent);
            opacity: 0.3;
            z-index: 3;
            pointer-events: none;
        }

        .payline.active { opacity: 0.75; box-shadow: 0 0 8px #FFD700; }
        .payline.won { opacity: 1; animation: pulse 1.2s infinite; box-shadow: 0 0 15px #FFEB3B; }
        @keyframes pulse { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.06); } }

        #spin-button {
            background: #FFD700;
            color: #004d00;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            margin: 12px auto;
            display: block;
            width: 80%;
            max-width: 280px;
            cursor: pointer;
            touch-action: manipulation;
        }

        #spin-button:disabled {
            background: #555;
            color: #aaa;
        }

        #message {
            font-size: 1.1rem;
            min-height: 2.2em;
            margin: 8px 0;
            color: #FFEB3B;
        }

        #inventory {
            background: rgba(0,0,0,0.4);
            border: 2px solid #8B4513;
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
        }

        #inventory h3 {
            margin: 0 0 10px;
            font-size: 1.2rem;
            color: #FFD700;
            text-align: center;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .item {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            font-size: 2.2rem;
        }

        .item:hover, .item:active {
            transform: scale(1.08);
            border-color: #FFD700;
            box-shadow: 0 0 12px #FFD70080;
        }

        .item-count {
            position: absolute;
            bottom: -6px;
            right: -6px;
            background: #FFD700;
            color: #004d00;
            font-size: 0.7rem;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #004d00;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-content {
            background: #1b5e20;
            border: 4px solid #8B4513;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 32px;
            color: #FFD700;
            cursor: pointer;
        }

        .modal-emoji { font-size: 80px; margin: 10px 0; }
        .modal-title { font-size: 1.5rem; margin: 8px 0; color: #FFEB3B; }
        .modal-rarity {
            font-size: 1.1rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin: 8px 0 12px;
        }
        .modal-desc { font-size: 0.95rem; line-height: 1.4; opacity: 0.9; margin: 12px 0; }
        .modal-count { font-size: 1.2rem; color: #81d4fa; margin: 8px 0; }
        .modal-multiplier { font-size: 1.1rem; color: #66bb6a; font-weight: bold; }
    </style>
</head>
<body>

<div class="slot-machine">
    <h1>Guerrilla Gardener's Fortune</h1>
    <div id="balance">Planting Credits: 500</div>
    <div id="bet-info">Bet: 20 credits | Paylines: 1</div>

    <div id="payline-selector">
        <button class="line-btn active" data-lines="1">1 Line</button>
        <button class="line-btn" data-lines="2">2 Lines</button>
        <button class="line-btn" data-lines="3">3 Lines</button>
    </div>

    <div class="reels-container">
        <div class="reels">
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
        </div>
        <div class="payline" id="payline-top" style="top: calc(var(--symbol-size) * 0.5);"></div>
        <div class="payline" id="payline-center" style="top: calc(var(--symbol-size) * 1.5);"></div>
        <div class="payline" id="payline-bottom" style="top: calc(var(--symbol-size) * 2.5);"></div>
    </div>

    <button id="spin-button">Spin to Plant!</button>
    <div id="message"></div>

    <div id="inventory">
        <h3>Won Items (tap to view)</h3>
        <ul class="item-list" id="won-items-list"></ul>
    </div>
</div>

<!-- Modal -->
<div class="modal" id="item-modal">
    <div class="modal-content">
        <span class="modal-close" id="modal-close">×</span>
        <div class="modal-emoji" id="modal-emoji"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-rarity" id="modal-rarity"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-count" id="modal-count"></div>
        <div class="modal-multiplier" id="modal-multiplier"></div>
    </div>
</div>

<script>
// ────────────────────────────────────────────────
// (The full script from the previous working version goes here)
// Just make sure to keep all the existing logic
// ────────────────────────────────────────────────

// ... paste your complete <script> content from the last working version ...

// Only change needed in renderInventory for better mobile feel:
function renderInventory(){
    wonItemsList.innerHTML='';
    const entries=Object.entries(inventory);
    if(entries.length===0){
        wonItemsList.innerHTML='<li style="grid-column:1/-1;text-align:center;opacity:0.7;padding:12px;">No items yet — start spinning!</li>';
        return;
    }
    entries.sort((a,b)=>{
        const order=['Legendary','Epic','Rare','Uncommon','Common'];
        return order.indexOf(symbolData[a[0]]?.rarity||'Common') - order.indexOf(symbolData[b[0]]?.rarity||'Common');
    });
    entries.forEach(([sym,count])=>{
        const data=symbolData[sym];
        const li=document.createElement('li');
        li.className='item';
        li.style.borderColor=data.color;
        li.innerHTML=`${sym}<span class="item-count">${count}</span>`;
        li.addEventListener('click',()=>showItemDetail(sym));
        li.addEventListener('touchstart',()=>showItemDetail(sym)); // extra touch support
        wonItemsList.appendChild(li);
    });
}

// Rest of your script remains unchanged
</script>
</body>
</html>
