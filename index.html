<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guerrilla Gardener's Fortune</title>
    <style>
        :root {
            --reel-size: 80px;
            --symbol-size: 80px;
        }
        @media (min-width: 500px) {
            :root {
                --reel-size: 90px;
                --symbol-size: 100px;
            }
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#1b5e20, #0d3311);
            color: #fff;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .slot-machine {
            background: #006400;
            border: 4px solid #8B4513;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.6rem; margin: 8px 0 12px; color: #FFEB3B; text-shadow: 0 2px 4px #000; }
        #balance { font-size: 1.4rem; margin: 8px 0; font-weight: bold; }
        #bet-info { font-size: 1rem; color: #FFD700; margin: 6px 0 12px; }
        #payline-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .line-btn {
            background: #004d00; color: white; border: 2px solid #FFD700; padding: 8px 14px;
            border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; min-width: 70px;
            touch-action: manipulation;
        }
        .line-btn.active { background: #FFD700; color: #004d00; box-shadow: 0 0 10px #FFD700; }
        .reels-container { position: relative; height: calc(var(--reel-size) * 3); margin: 12px 0; width: 100%; max-width: 420px; }
        .reels { display: flex; justify-content: center; gap: 6px; height: 100%; }
        .reel { width: var(--reel-size); height: 100%; background: white; border: 2px solid #222; border-radius: 6px; overflow: hidden; flex-shrink: 0; }
        .reel-strip { position: absolute; top: 0; left: 0; width: 100%; transition: transform 2s ease-out; }
        .symbol { height: var(--symbol-size); width: 100%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--reel-size) * 0.65); }
        .payline { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(to right, transparent, #FFD700 20%, #FFD700 80%, transparent); opacity: 0.3; z-index: 3; pointer-events: none; }
        .payline.active { opacity: 0.75; box-shadow: 0 0 8px #FFD700; }
        .payline.won { opacity: 1; animation: pulse 1.2s infinite; box-shadow: 0 0 15px #FFEB3B; }
        @keyframes pulse { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.06); } }
        #spin-button {
            background: #FFD700; color: #004d00; border: none; padding: 14px 32px; font-size: 1.2rem;
            font-weight: bold; border-radius: 8px; margin: 12px auto; display: block; width: 80%; max-width: 280px;
            cursor: pointer; touch-action: manipulation;
        }
        #spin-button:disabled { background: #555; color: #aaa; }
        #message { font-size: 1.1rem; min-height: 2.2em; margin: 8px 0; color: #FFEB3B; }
        #inventory { background: rgba(0,0,0,0.4); border: 2px solid #8B4513; border-radius: 8px; padding: 12px; margin-top: 16px; }
        #inventory h3 { margin: 0 0 10px; font-size: 1.2rem; color: #FFD700; text-align: center; }
        .item-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
        .item {
            background: rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; text-align: center; cursor: pointer;
            border: 2px solid transparent; transition: all 0.15s; font-size: 2.2rem; position: relative;
        }
        .item:hover, .item:active { transform: scale(1.08); border-color: #FFD700; box-shadow: 0 0 12px #FFD70080; }
        .item-count {
            position: absolute; bottom: -6px; right: -6px; background: #FFD700; color: #004d00;
            font-size: 0.7rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; border: 2px solid #004d00;
        }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000;
            align-items: center; justify-content: center; padding: 12px;
        }
        .modal-content {
            background: #1b5e20; border: 4px solid #8B4513; border-radius: 12px; padding: 20px;
            width: 100%; max-width: 360px; text-align: center; position: relative;
        }
        .modal-close { position: absolute; top: 8px; right: 12px; font-size: 32px; color: #FFD700; cursor: pointer; }
        .modal-emoji { font-size: 80px; margin: 10px 0; }
        .modal-title { font-size: 1.5rem; margin: 8px 0; color: #FFEB3B; }
        .modal-rarity { font-size: 1.1rem; font-weight: bold; padding: 6px 14px; border-radius: 20px; display: inline-block; margin: 8px 0 12px; }
        .modal-desc { font-size: 0.95rem; line-height: 1.4; opacity: 0.9; margin: 12px 0; }
        .modal-count { font-size: 1.2rem; color: #81d4fa; margin: 8px 0; }
        .modal-multiplier { font-size: 1.1rem; color: #66bb6a; font-weight: bold; }
    </style>
</head>
<body>

<div class="slot-machine">
    <h1>Guerrilla Gardener's Fortune</h1>
    <div id="balance">Planting Credits: 500</div>
    <div id="bet-info">Bet: 20 credits | Paylines: 1</div>

    <div id="payline-selector">
        <button class="line-btn active" data-lines="1">1 Line</button>
        <button class="line-btn" data-lines="2">2 Lines</button>
        <button class="line-btn" data-lines="3">3 Lines</button>
    </div>

    <div class="reels-container">
        <div class="reels">
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
            <div class="reel"><div class="reel-strip"></div><div class="reel-highlight"></div></div>
        </div>
        <div class="payline" id="payline-top" style="top: calc(var(--symbol-size) * 0.5);"></div>
        <div class="payline" id="payline-center" style="top: calc(var(--symbol-size) * 1.5);"></div>
        <div class="payline" id="payline-bottom" style="top: calc(var(--symbol-size) * 2.5);"></div>
    </div>

    <button id="spin-button">Spin to Plant!</button>
    <div id="message"></div>

    <div id="inventory">
        <h3>Won Items (tap to view)</h3>
        <ul class="item-list" id="won-items-list"></ul>
    </div>
</div>

<div class="modal" id="item-modal">
    <div class="modal-content">
        <span class="modal-close" id="modal-close">×</span>
        <div class="modal-emoji" id="modal-emoji"></div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-rarity" id="modal-rarity"></div>
        <div class="modal-desc" id="modal-desc"></div>
        <div class="modal-count" id="modal-count"></div>
        <div class="modal-multiplier" id="modal-multiplier"></div>
    </div>
</div>

<script>
// ────────────────────────────────────────────────
// Data & Constants
// ────────────────────────────────────────────────
const symbols = ['🌱', '🌿', '🌳', '🛠️', '💧'];

const symbolData = {
    '🌱': { name: 'Seed Packet',     desc: 'A small packet of wildflower seeds perfect for starting a secret garden.', rarity: 'Common',    color: '#e0e0e0', mult: 1.0 },
    '💧': { name: 'Watering Can',    desc: 'Essential for keeping your guerrilla plants alive during dry spells.',     rarity: 'Uncommon',  color: '#81d4fa', mult: 1.5 },
    '🌿': { name: 'Herb Cutting',    desc: 'Fresh basil or mint — great for urban herbal remedies and cooking.',      rarity: 'Rare',      color: '#66bb6a', mult: 2.0 },
    '🛠️': { name: 'Gardening Tool',  desc: 'A sturdy trowel for digging in tough city soil without being noticed.',   rarity: 'Epic',      color: '#ab47bc', mult: 3.0 },
    '🌳': { name: 'Young Tree',      desc: 'A baby tree ready to grow tall and provide shade for future generations.', rarity: 'Legendary', color: '#ffb300', mult: 5.0 }
};

const winAmounts = { '🌱': 20, '🌿': 30, '🌳': 50, '🛠️': 40, '💧': 25 };

const baseBet = 20;
const symbolHeight = 100;
const visibleSymbols = 3;
const extraSymbols = 30;

// DOM
const reels = document.querySelectorAll('.reel');
const reelStrips = Array.from(reels).map(r => r.querySelector('.reel-strip'));
const reelHighlights = Array.from(reels).map(r => r.querySelector('.reel-highlight'));
const paylines = {
    top: document.getElementById('payline-top'),
    center: document.getElementById('payline-center'),
    bottom: document.getElementById('payline-bottom')
};
const spinButton = document.getElementById('spin-button');
const balanceDisplay = document.getElementById('balance');
const betInfo = document.getElementById('bet-info');
const messageDisplay = document.getElementById('message');
const lineButtons = document.querySelectorAll('.line-btn');
const wonItemsList = document.getElementById('won-items-list');
const modal = document.getElementById('item-modal');
const modalClose = document.getElementById('modal-close');

let balance = 500;
let activePaylines = 1;
const inventory = {};

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(f,d,t='sine'){const o=audioCtx.createOscillator();o.type=t;o.frequency.value=f;const g=audioCtx.createGain();g.gain.value=0.4;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d/1000);o.stop(audioCtx.currentTime+d/1000);}
function playSpinSound(){playSound(700,250,'sawtooth');setTimeout(()=>playSound(550,250,'sawtooth'),150);setTimeout(()=>playSound(400,300,'sawtooth'),350);}
function playStopSound(){playSound(120,120,'square');}
function playSmallWinSound(){playSound(523,300);setTimeout(()=>playSound(659,300),200);}
function playBigWinSound(){playSound(440,250);setTimeout(()=>playSound(554,250),200);setTimeout(()=>playSound(659,250),450);setTimeout(()=>playSound(784,400),700);}
function playMegaSound(){playBigWinSound();setTimeout(()=>{playSound(880,300);setTimeout(()=>playSound(1046,600),250);},1400);}

// Helpers
function getRandomSymbol(){return symbols[Math.floor(Math.random()*symbols.length)];}

function createStrip(strip){
    strip.innerHTML='';
    for(let i=0;i<visibleSymbols+extraSymbols;i++){
        const s=document.createElement('div');s.classList.add('symbol');s.textContent=getRandomSymbol();strip.appendChild(s);
    }
}

function prepareStrip(strip,topSym,midSym,botSym){
    strip.innerHTML='';
    for(let i=0;i<visibleSymbols+extraSymbols;i++){
        const s=document.createElement('div');s.classList.add('symbol');s.textContent=getRandomSymbol();strip.appendChild(s);
    }
    const spinAmount=extraSymbols-Math.floor(Math.random()*4);
    strip.children[spinAmount].textContent=topSym;
    strip.children[spinAmount+1].textContent=midSym;
    strip.children[spinAmount+2].textContent=botSym;
    return spinAmount*100;
}

function updateBetDisplay(){
    const bet=baseBet*activePaylines;
    betInfo.textContent=`Bet: ${bet} credits | Paylines: ${activePaylines}`;
}

function setActivePaylines(num){
    activePaylines=num;
    lineButtons.forEach(b=>b.classList.toggle('active',parseInt(b.dataset.lines)===num));
    paylines.top.classList.toggle('active',num>=2);
    paylines.center.classList.toggle('active',num>=1);
    paylines.bottom.classList.toggle('active',num>=3);
    updateBetDisplay();
}

function clearAllHighlights(){
    reelHighlights.forEach(h=>h.classList.remove('won'));
    Object.values(paylines).forEach(p=>p.classList.remove('won'));
}

function addToInventory(symbol){
    inventory[symbol]=(inventory[symbol]||0)+1;
    renderInventory();
}

function showItemDetail(symbol){
    const data = symbolData[symbol];
    if(!data) return;
    document.getElementById('modal-emoji').textContent = symbol;
    document.getElementById('modal-title').textContent = data.name;
    const r = document.getElementById('modal-rarity');
    r.textContent = data.rarity;
    r.style.background = data.color + '33';
    r.style.color = data.color;
    r.style.border = `2px solid ${data.color}`;
    document.getElementById('modal-desc').textContent = data.desc;
    document.getElementById('modal-count').textContent = `You own: ${inventory[symbol] || 0}`;
    document.getElementById('modal-multiplier').textContent = `Credit Value: ×${data.mult}`;
    modal.style.display = 'flex';
}

function renderInventory(){
    wonItemsList.innerHTML='';
    const entries=Object.entries(inventory);
    if(entries.length===0){
        wonItemsList.innerHTML='<li style="grid-column:1/-1;text-align:center;opacity:0.7;padding:12px;">No items yet — start spinning!</li>';
        return;
    }
    entries.sort((a,b)=>{
        const order=['Legendary','Epic','Rare','Uncommon','Common'];
        return order.indexOf(symbolData[a[0]]?.rarity||'Common') - order.indexOf(symbolData[b[0]]?.rarity||'Common');
    });
    entries.forEach(([sym,count])=>{
        const data=symbolData[sym];
        const li=document.createElement('li');
        li.className='item';
        li.style.borderColor=data.color;
        li.innerHTML=`${sym}<span class="item-count">${count}</span>`;
        li.addEventListener('click',()=>showItemDetail(sym));
        li.addEventListener('touchstart',e=>{e.preventDefault(); showItemDetail(sym);});
        wonItemsList.appendChild(li);
    });
}

// Core Game
function spin(){
    const bet=baseBet*activePaylines;
    if(balance<bet){
        messageDisplay.textContent='Not enough planting credits! Refresh to restart.';
        return;
    }
    clearAllHighlights();
    balance-=bet;
    balanceDisplay.textContent=`Planting Credits: ${balance}`;
    messageDisplay.textContent='';
    messageDisplay.classList.remove('win');
    spinButton.disabled=true;

    const finalGrid=[
        Array(5).fill().map(getRandomSymbol),
        Array(5).fill().map(getRandomSymbol),
        Array(5).fill().map(getRandomSymbol)
    ];

    const durations=[1.0,1.4,1.8,2.2,2.6];

    reelStrips.forEach((strip,col)=>{
        const t=finalGrid[0][col],m=finalGrid[1][col],b=finalGrid[2][col];
        const distance=prepareStrip(strip,t,m,b);
        strip.style.transition='none';
        strip.style.transform='translateY(0)';
        strip.offsetHeight;
        strip.style.transition=`transform ${durations[col]}s ease-out`;
        strip.style.transform=`translateY(-${distance}px)`;
        setTimeout(playStopSound,durations[col]*1000-80);
    });

    setTimeout(()=>{checkWins(finalGrid);spinButton.disabled=false;},3200);
}

function checkWins(grid){
    let totalWin=0;
    let winningPaylines=[];
    let wonItemsThisSpin=new Set();

    const linesToCheck=[];
    if(activePaylines>=1)linesToCheck.push({name:'center',row:1,el:paylines.center});
    if(activePaylines>=2)linesToCheck.push({name:'top',row:0,el:paylines.top});
    if(activePaylines>=3)linesToCheck.push({name:'bottom',row:2,el:paylines.bottom});

    linesToCheck.forEach(line=>{
        const rowSym=grid[line.row];
        let i=0;
        while(i<rowSym.length){
            let j=i+1;
            while(j<rowSym.length&&rowSym[j]===rowSym[i])j++;
            const len=j-i;
            if(len>=2){
                const sym=rowSym[i];
                const base=len===2?10:len===3?winAmounts[sym]*2:len===4?winAmounts[sym]*5:len===5?winAmounts[sym]*10:0;
                const mult=symbolData[sym]?.mult||1;
                totalWin+=Math.round(base*mult);
                wonItemsThisSpin.add(sym);
                for(let k=i;k<j;k++)reelHighlights[k].classList.add('won');
                line.el.classList.add('won');
                winningPaylines.push(line.name);
            }
            i=j;
        }
    });

    wonItemsThisSpin.forEach(sym=>addToInventory(sym));

    if(totalWin>0||wonItemsThisSpin.size>0){
        balance+=totalWin;
        balanceDisplay.textContent=`Planting Credits: ${balance}`;
        let msg=wonItemsThisSpin.size>0?`Collected: ${Array.from(wonItemsThisSpin).join(' ')} `:'';
        if(totalWin>0)msg+=`+${totalWin} credits `;
        msg+=`(${winningPaylines.join(', ')||'—'})! 🎉`;
        messageDisplay.textContent=msg;
        messageDisplay.classList.add('win');

        if(totalWin>=200||wonItemsThisSpin.has('🌳'))playMegaSound();
        else if(totalWin>=50||wonItemsThisSpin.size>=2)playBigWinSound();
        else playSmallWinSound();

        setTimeout(()=>{
            reelHighlights.forEach((h,i)=>{if(h.classList.contains('won'))reels[i].style.animation='win-shake 0.8s';});
            setTimeout(()=>reels.forEach(r=>r.style.animation=''),800);
        },400);
    }else{
        messageDisplay.textContent='No growth or finds this time... Try again!';
    }

    setTimeout(clearAllHighlights,5000);
}

// Init & Events
reelStrips.forEach(createStrip);
setActivePaylines(1);
renderInventory();

lineButtons.forEach(btn=>btn.addEventListener('click',()=>setActivePaylines(parseInt(btn.dataset.lines))));
spinButton.addEventListener('click',spin);

modalClose.addEventListener('click',()=>modal.style.display='none');
modal.addEventListener('click',e=>{if(e.target===modal)modal.style.display='none';});
</script>
</body>
</html>
