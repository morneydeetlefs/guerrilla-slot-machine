<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guerrilla Gardener's Fortune Slot Machine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #228B22; /* Forest green for gardening theme */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .slot-machine {
            background-color: #006400; /* Dark green */
            border: 5px solid #8B4513; /* Earthy brown border */
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        #payline-label {
            font-size: 20px;
            color: #FFD700;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .reels-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        .reels {
            display: flex;
            justify-content: center;
            height: 100%;
        }
        .reel {
            width: 100px;
            height: 300px;
            background-color: #fff;
            border: 2px solid #000;
            margin: 0 10px;
            overflow: hidden;
            position: relative;
        }
        .reel-strip {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transition: transform 1.5s ease-out;
        }
        .symbol {
            height: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px; /* Larger emojis for better visibility */
            box-sizing: border-box;
        }
        .reel-highlight {
            position: absolute;
            inset: 100px 0 100px 0;
            background: rgba(255, 255, 0, 0.2);
            border: 3px solid transparent;
            border-top: 3px solid #FFD700;
            border-bottom: 3px solid #FFD700;
            opacity: 0;
            transition: opacity 0.3s, box-shadow 0.3s;
            pointer-events: none;
            z-index: 2;
        }
        .reel-highlight.active {
            opacity: 1;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.8);
            animation: highlight-glow 1s ease-in-out infinite alternate;
        }
        @keyframes highlight-glow {
            from { box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.5); }
            to { box-shadow: inset 0 0 30px rgba(255, 215, 0, 1); }
        }
        .payline {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, transparent 0%, #FFD700 20%, #FFD700 80%, transparent 100%);
            transform: translateY(-50%);
            opacity: 0.3;
            transition: all 0.5s ease;
            border-radius: 2px;
            z-index: 3;
        }
        .payline.big-win {
            opacity: 1;
            box-shadow: 0 0 20px #FFD700;
            animation: payline-pulse 1.5s infinite;
        }
        @keyframes payline-pulse {
            0%, 100% { transform: translateY(-50%) scaleX(1); }
            50% { transform: translateY(-50%) scaleX(1.2); }
        }
        @keyframes win-shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); }
            20%, 40%, 60%, 80% { transform: translateX(2px); }
        }
        #spin-button {
            background-color: #FFD700; /* Gold for fortune */
            color: #006400;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        #spin-button:hover {
            background-color: #FFEC8B;
        }
        #spin-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #balance {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #message {
            font-size: 18px;
            color: #FFD700;
        }
    </style>
</head>
<body>
    <div class="slot-machine">
        <h1>Guerrilla Gardener's Fortune</h1>
        <div id="balance">Seed Credits: 100</div>
        <div id="payline-label">Center Line Wins Only! 🎯</div>
        <div class="reels-container">
            <div class="reels">
                <div class="reel" id="reel1">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel" id="reel2">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
                <div class="reel" id="reel3">
                    <div class="reel-strip"></div>
                    <div class="reel-highlight"></div>
                </div>
            </div>
            <div class="payline"></div>
        </div>
        <button id="spin-button">Spin to Plant!</button>
        <div id="message"></div>
    </div>

    <script>
        const symbols = ['🌱', '🌿', '🌳', '🛠️', '💧']; // Guerrilla gardening symbols
        const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
        const reelStrips = reels.map(reel => reel.querySelector('.reel-strip'));
        const reelHighlights = reels.map(reel => reel.querySelector('.reel-highlight'));
        const payline = document.querySelector('.payline');
        const spinButton = document.getElementById('spin-button');
        const balanceDisplay = document.getElementById('balance');
        const messageDisplay = document.getElementById('message');
        let balance = 100;
        const spinCost = 10;
        const symbolHeight = 100;
        const visibleSymbols = 3;
        const extraSymbols = 20;
        const winAmounts = {
            '🌱': 20,
            '🌿': 30,
            '🌳': 50,
            '🛠️': 40,
            '💧': 25
        };

        // Audio setup
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioCtx.createOscillator();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration / 1000);
            oscillator.stop(audioCtx.currentTime + duration / 1000);
        }

        function playSpinSound() {
            playSound(600, 200, 'sawtooth');
            setTimeout(() => playSound(500, 200, 'sawtooth'), 150);
            setTimeout(() => playSound(400, 200, 'sawtooth'), 300);
        }

        function playStopSound() {
            playSound(100, 100, 'square');
        }

        function playSmallWinSound() {
            playSound(523, 300);
            setTimeout(() => playSound(659, 300), 200);
        }

        function playBigWinSound() {
            playSound(440, 200);
            setTimeout(() => playSound(554, 200), 200);
            setTimeout(() => playSound(659, 200), 400);
            setTimeout(() => playSound(880, 500), 600);
        }

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function createStrip(reelStrip) {
            reelStrip.innerHTML = '';
            for (let i = 0; i < visibleSymbols + extraSymbols; i++) {
                const symbol = document.createElement('div');
                symbol.classList.add('symbol');
                symbol.textContent = getRandomSymbol();
                reelStrip.appendChild(symbol);
            }
        }

        function prepareStrip(reelStrip, finalSymbol) {
            reelStrip.innerHTML = '';
            for (let i = 0; i < visibleSymbols + extraSymbols; i++) {
                const symbol = document.createElement('div');
                symbol.classList.add('symbol');
                symbol.textContent = getRandomSymbol();
                reelStrip.appendChild(symbol);
            }
            const spinAmount = extraSymbols - Math.floor(Math.random() * 3);
            const middlePosition = spinAmount + 1;
            reelStrip.children[middlePosition].textContent = finalSymbol;
            return spinAmount * symbolHeight;
        }

        function clearHighlights() {
            reelHighlights.forEach(h => h.classList.remove('active'));
            payline.classList.remove('big-win');
        }

        function highlightReels(indices) {
            reelHighlights.forEach((highlight, i) => {
                highlight.classList.toggle('active', indices.includes(i));
            });
        }

        function spin() {
            if (balance < spinCost) {
                messageDisplay.textContent = 'Out of seeds! Refresh to replant.';
                spinButton.disabled = true;
                return;
            }
            clearHighlights();
            balance -= spinCost;
            updateBalance();
            messageDisplay.textContent = '';
            spinButton.disabled = true;

            const finalSymbols = reels.map(() => getRandomSymbol());

            playSpinSound();

            const durations = [1.5, 2.0, 2.5];
            const maxDuration = durations[2] * 1000 + 500;

            reelStrips.forEach((reelStrip, index) => {
                const spinDistance = prepareStrip(reelStrip, finalSymbols[index]);
                reelStrip.style.transition = 'none';
                reelStrip.style.transform = 'translateY(0px)';
                reelStrip.offsetHeight;
                reelStrip.style.transition = `transform ${durations[index]}s ease-out`;
                reelStrip.style.transform = `translateY(-${spinDistance}px)`;

                setTimeout(() => playStopSound(), durations[index] * 1000 - 100);
            });

            setTimeout(() => {
                checkWin(finalSymbols);
                spinButton.disabled = false;
            }, maxDuration);
        }

        function checkWin(finalSymbols) {
            let winAmount = 0;
            let message = '';
            let isBigWin = false;
            let highlightIndices = [];

            if (finalSymbols[0] === finalSymbols[1] && finalSymbols[1] === finalSymbols[2]) {
                winAmount = winAmounts[finalSymbols[0]] * 2;
                message = `Triple ${finalSymbols[0]}! +${winAmount} seeds! 🎉`;
                highlightIndices = [0, 1, 2];
                isBigWin = true;
                playBigWinSound();
                // Shake reels
                reels.forEach(reel => {
                    reel.style.animation = 'win-shake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both';
                    setTimeout(() => {
                        reel.style.animation = '';
                    }, 600);
                });
            } else if (finalSymbols[0] === finalSymbols[1]) {
                winAmount = 10;
                message = `Left Pair ${finalSymbols[0]}! +10 seeds! 👍`;
                highlightIndices = [0, 1];
                playSmallWinSound();
            } else if (finalSymbols[1] === finalSymbols[2]) {
                winAmount = 10;
                message = `Right Pair ${finalSymbols[1]}! +10 seeds! 👍`;
                highlightIndices = [1, 2];
                playSmallWinSound();
            } else {
                message = 'No growth this time. Try again!';
            }

            if (winAmount > 0) {
                balance += winAmount;
                updateBalance();
            }
            messageDisplay.textContent = message;

            if (highlightIndices.length > 0) {
                highlightReels(highlightIndices);
            }

            if (isBigWin) {
                payline.classList.add('big-win');
            }

            // Clear highlights after celebration
            setTimeout(clearHighlights, 4000);
        }

        function updateBalance() {
            balanceDisplay.textContent = `Seed Credits: ${balance}`;
        }

        // Initialize
        reelStrips.forEach(createStrip);
        spinButton.addEventListener('click', spin);
    </script>
</body>
</html>
